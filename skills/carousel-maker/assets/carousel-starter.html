<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FavStash carousel starter</title>
  <style>
    :root {
      --page: #f4f0e8;
      --ink: #141414;
      --accent: #ff5b3d;
      --muted: #716b62;
      --font: Inter, ui-sans-serif, system-ui, sans-serif;
      --margin: 88px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #222; font-family: var(--font); color: var(--ink); }
    .slide {
      position: relative;
      width: 1080px;
      height: 1350px;
      padding: var(--margin);
      overflow: hidden;
      background: var(--page);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .eyebrow { font-size: 34px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
    h1 { max-width: 900px; margin: 28px 0 0; font-size: 116px; line-height: .94; letter-spacing: -.055em; }
    p { max-width: 850px; margin: 0; font-size: 66px; line-height: 1.08; letter-spacing: -.035em; }
    .number { color: var(--accent); font-weight: 800; }
    footer { display: flex; justify-content: space-between; align-items: end; color: var(--muted); font-size: 30px; }
  </style>
</head>
<body>
  <!-- Duplicate one .slide per exported image. Replace copy and brand tokens; do not ship placeholder text. -->
  <section class="slide" data-slide="1">
    <div>
      <div class="eyebrow">Specific category</div>
      <h1>A cover that earns the next swipe.</h1>
    </div>
    <footer><span>Creator / Brand</span><span>1 / 3</span></footer>
  </section>
  <section class="slide" data-slide="2">
    <div class="eyebrow"><span class="number">01</span> One idea</div>
    <p>Keep the body focused enough to understand at a glance, then make the visual support the point.</p>
    <footer><span>Creator / Brand</span><span>2 / 3</span></footer>
  </section>
  <section class="slide" data-slide="3">
    <div>
      <div class="eyebrow">Payoff</div>
      <h1>End with synthesis, not repetition.</h1>
    </div>
    <footer><span>Useful next action</span><span>3 / 3</span></footer>
  </section>
</body>
</html>
